<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#183f38"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><title>Novelty · 论文查新</title></head>
<body><main>
<header><span class="brand">N<span class="brand-dot">.</span></span><div><strong>Novelty</strong><p>论文查新工作台</p></div><span class="tag">单篇论文 · 证据驱动</span></header>
<div id="service" class="notice" role="status" hidden></div><div id="update" class="notice" hidden>新版本已就绪。<button id="refresh">更新页面</button></div>
<section class="intro"><p class="eyebrow">从论文到证据</p><h1>让研究的新意，<br>有据可循。</h1><p>上传一篇论文，查看查新过程，获取完整报告。</p></section>
<div class="workspace"><section class="panel input-panel"><div class="section-title"><span>01</span><h2>提交论文</h2></div>
<label id="drop" class="drop" for="file"><span class="file-symbol">↑</span><strong>选择或拖入 PDF</strong><span>一次一篇 · 最大 25 MiB</span><input id="file" type="file" accept=".pdf,application/pdf"></label>
<div id="selection" hidden><p id="filename"></p><button id="remove" class="secondary">移除文件</button></div>
<button id="start" class="primary" disabled>开始查新 <span>→</span></button><p class="hint">解析与查新由后端执行，关闭页面不会取消任务。</p><p id="upload-error" class="error" role="alert" hidden></p>
</section><section class="panel"><div class="section-title"><span>02</span><h2>运行进度</h2><strong id="status" class="badge">尚未开始</strong></div><p id="run-id" class="hint"></p><p id="stage">提交论文后，在这里观察运行状态。</p><ol id="steps"></ol><p id="elapsed" class="hint"></p><p id="connection-error" class="error" role="alert" hidden></p><p id="task-error" class="error" role="alert" hidden></p></section></div>
<section class="panel" id="artifacts-panel" hidden><div class="section-title"><span>03</span><h2>阶段成果</h2></div><p class="hint">以下为本次运行已发布的阶段结果；最终结论以报告为准。</p><div id="artifacts"></div><p id="artifact-error" class="error" role="alert" hidden></p></section>
<section class="panel report-panel"><div class="section-title"><span>04</span><h2>查新报告</h2><a id="download" class="secondary" hidden>下载原始 .md ↓</a></div><p id="report-placeholder" class="hint">报告生成后，将在这里展示。</p><p id="report-error" class="error" role="alert" hidden></p><button id="retry-report" hidden>重新获取报告</button><article id="report" class="markdown"></article></section>
<footer>Novelty Engine <span>查新结论依赖本次检索范围与证据充分性。</span></footer>
</main><script type="module" src="/src/main.ts"></script></body></html>
